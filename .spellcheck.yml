matrix:
  - name: Markdown
    aspell:
      lang: en
      d: [en_GB, en]
    dictionary:
      wordlists:
        - .wordlist.txt
      encoding: utf-8
    pipeline:
      # Process Markdown content
      - pyspelling.filters.markdown:
          markdown_extensions:
            - markdown.extensions.extra
      # Process HTML content (like comments, alt attributes)
      - pyspelling.filters.html:
          comments: true
          attributes:
            - alt
          ignores:
            - 'code'
            - 'pre'
            - 'blockquote'
      # Context filter for fences and inline code
      - pyspelling.filters.context:
          context_visible_first: true
          escapes: "\\[\\`~]"
          delimiters:
            # Ignore multiline content between fences (``` or more)
            - open: '(?s)^(?P<open> *`{3,})$'
              close: '^(?P=open)$'
            # Ignore text between inline backticks
            - open: '(?P<open>`+)'
              close: '(?P=open)'
    sources:
      - '**/*.md'
    default_encoding: utf-8
